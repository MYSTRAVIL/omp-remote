name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun x --bun tsc -p tsconfig.base.json --noEmit
      - name: Test
        run: bun test
      - name: Lint
        run: bun x biome check packages scripts apps
      - name: Build web
        run: bun run build.ts
        working-directory: apps/web
